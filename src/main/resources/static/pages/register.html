<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Đăng ký tài khoản</title>

    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/register.css" />
  </head>
  <body>
    <div data-app-header></div>

    <main class="register-page">
      <section class="register-card">
        <div class="register-heading">
          <h1>Đăng ký tài khoản</h1>

          <p>Vui lòng nhập đầy đủ thông tin bên dưới.</p>
        </div>

        <div
          id="form-message"
          class="form-message"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="register-form" novalidate>
          <div class="form-grid">
            <!-- Họ và tên đệm -->
            <div class="form-group">
              <label class="form-label" for="lastName">
                Họ và tên đệm
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="lastName"
                name="lastName"
                type="text"
                maxlength="150"
                autocomplete="family-name"
                placeholder="Ví dụ: Nguyễn Văn"
              />

              <small id="lastName-error" class="field-error"></small>
            </div>

            <!-- Tên chính -->
            <div class="form-group">
              <label class="form-label" for="firstName">
                Tên
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="firstName"
                name="firstName"
                type="text"
                maxlength="100"
                autocomplete="given-name"
                placeholder="Ví dụ: An"
              />

              <small id="firstName-error" class="field-error"></small>
            </div>

            <!-- Email -->
            <div class="form-group full-width">
              <label class="form-label" for="email">
                Email
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                maxlength="320"
                autocomplete="email"
                placeholder="example@email.com"
              />

              <small id="email-error" class="field-error"></small>
            </div>

            <!-- Mật khẩu -->
            <div class="form-group full-width">
              <label class="form-label" for="password">
                Mật khẩu
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="64"
                autocomplete="new-password"
                placeholder="Tối thiểu 8 ký tự"
              />

              <small id="password-error" class="field-error"></small>
            </div>

            <!-- Ngày sinh -->
            <div class="form-group">
              <label class="form-label" for="dateOfBirth">
                Ngày sinh
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="dateOfBirth"
                name="dateOfBirth"
                type="date"
              />

              <small id="dateOfBirth-error" class="field-error"></small>
            </div>

            <!-- Giới tính -->
            <div class="form-group">
              <label class="form-label" for="gender">
                Giới tính
                <span class="required">*</span>
              </label>

              <select class="form-control" id="gender" name="gender">
                <option value="">-- Chọn giới tính --</option>

                <option value="MALE">Nam</option>

                <option value="FEMALE">Nữ</option>

                <option value="OTHER">Khác</option>
              </select>

              <small id="gender-error" class="field-error"></small>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group full-width">
              <label class="form-label" for="address">
                Địa chỉ
                <span class="required">*</span>
              </label>

              <textarea
                class="form-control"
                id="address"
                name="address"
                maxlength="255"
                rows="3"
                placeholder="Nhập địa chỉ"
              ></textarea>

              <small id="address-error" class="field-error"></small>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group full-width">
              <label class="form-label" for="phone">
                Số điện thoại
                <span class="required">*</span>
              </label>

              <input
                class="form-control"
                id="phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                autocomplete="tel"
                placeholder="Ví dụ: 0912345678"
              />

              <small id="phone-error" class="field-error"></small>
            </div>
          </div>

          <button
            id="register-button"
            class="btn btn-primary btn-block"
            type="submit"
          >
            Đăng ký
          </button>
        </form>

        <p class="login-link">
          Đã có tài khoản?
          <a href="/pages/login.html"> Đăng nhập </a>
        </p>
      </section>
    </main>

    <div data-app-footer></div>

    <script src="/js/layout.js"></script>
    <script type="module" src="/js/auth-ui.js"></script>
    <script type="module" src="/js/register.js"></script>
  </body>
</html>
