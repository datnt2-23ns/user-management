<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Thông tin cá nhân</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div data-app-header></div>

<main class="profile-page">
    <section class="profile-card">
        <div class="profile-heading">
            <h1>Thông tin cá nhân</h1>

            <p>
                Thông tin tài khoản đang đăng nhập.
            </p>
        </div>

        <div
                id="profile-loading"
                class="profile-state"
        >
            Đang tải thông tin...
        </div>

        <div
                id="profile-error"
                class="profile-message error"
                role="alert"
                aria-live="polite"
                hidden
        ></div>

        <div
                id="profile-content"
                class="profile-content"
                hidden
        >
            <aside class="profile-summary">
                <img
                        id="profile-avatar"
                        class="profile-avatar"
                        src="/images/default-avatar.svg"
                        alt="Ảnh đại diện"
                >

                <h2 id="profile-full-name">
                    Người dùng
                </h2>

                <p id="profile-email">
                    —
                </p>

                <div class="profile-badges">
                    <span
                            id="profile-role"
                            class="profile-badge"
                    >
                        —
                    </span>

                    <span
                            id="profile-status"
                            class="profile-badge"
                    >
                        —
                    </span>
                </div>
            </aside>

            <section class="profile-details">
                <h2>Chi tiết hồ sơ</h2>

                <dl class="profile-grid">
                    <div class="profile-field">
                        <dt>Họ và tên đệm</dt>
                        <dd id="profile-last-name">—</dd>
                    </div>

                    <div class="profile-field">
                        <dt>Tên</dt>
                        <dd id="profile-first-name">—</dd>
                    </div>

                    <div class="profile-field">
                        <dt>Ngày sinh</dt>
                        <dd id="profile-date-of-birth">—</dd>
                    </div>

                    <div class="profile-field">
                        <dt>Giới tính</dt>
                        <dd id="profile-gender">—</dd>
                    </div>

                    <div class="profile-field full-width">
                        <dt>Địa chỉ</dt>
                        <dd id="profile-address">—</dd>
                    </div>

                    <div class="profile-field">
                        <dt>Số điện thoại</dt>
                        <dd id="profile-phone">—</dd>
                    </div>

                    <div class="profile-field">
                        <dt>Ngày tạo tài khoản</dt>
                        <dd id="profile-created-at">—</dd>
                    </div>
                </dl>
            </section>
        </div>
    </section>
</main>

<div data-app-footer></div>

<script src="/js/layout.js"></script>
<script type="module" src="/js/auth-ui.js"></script>
<script type="module" src="/js/profile.js"></script>

</body>
</html>
