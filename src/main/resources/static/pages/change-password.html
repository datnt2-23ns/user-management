<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Đổi mật khẩu</title>

    <link
            rel="stylesheet"
            href="/css/main.css"
    >

    <link
            rel="stylesheet"
            href="/css/change-password.css"
    >
</head>
<body>

<div data-app-header></div>

<main class="change-password-page">
    <section class="change-password-card">
        <header class="change-password-heading">
            <h1>Đổi mật khẩu</h1>

            <p>
                Nhập mật khẩu hiện tại và mật khẩu mới của bạn.
            </p>
        </header>

        <form
                id="change-password-form"
                novalidate
        >
            <div class="form-group">
                <label for="current-password">
                    Mật khẩu hiện tại
                    <span aria-hidden="true">*</span>
                </label>

                <div class="password-input-wrapper">
                    <input
                            id="current-password"
                            name="currentPassword"
                            type="password"
                            maxlength="100"
                            autocomplete="current-password"
                    >

                    <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle
                            data-target="current-password"
                            aria-label="Hiện mật khẩu hiện tại"
                            aria-pressed="false"
                    >
                        Hiện
                    </button>
                </div>

                <span
                        class="field-error"
                        data-field-error="currentPassword"
                ></span>
            </div>

            <div class="form-group">
                <label for="new-password">
                    Mật khẩu mới
                    <span aria-hidden="true">*</span>
                </label>

                <div class="password-input-wrapper">
                    <input
                            id="new-password"
                            name="newPassword"
                            type="password"
                            minlength="8"
                            maxlength="100"
                            autocomplete="new-password"
                    >

                    <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle
                            data-target="new-password"
                            aria-label="Hiện mật khẩu mới"
                            aria-pressed="false"
                    >
                        Hiện
                    </button>
                </div>

                <p class="field-help">
                    Mật khẩu mới phải có ít nhất 8 ký tự.
                </p>

                <span
                        class="field-error"
                        data-field-error="newPassword"
                ></span>
            </div>

            <div class="form-group">
                <label for="confirm-password">
                    Xác nhận mật khẩu mới
                    <span aria-hidden="true">*</span>
                </label>

                <div class="password-input-wrapper">
                    <input
                            id="confirm-password"
                            name="confirmPassword"
                            type="password"
                            maxlength="100"
                            autocomplete="new-password"
                    >

                    <button
                            class="password-toggle"
                            type="button"
                            data-password-toggle
                            data-target="confirm-password"
                            aria-label="Hiện xác nhận mật khẩu mới"
                            aria-pressed="false"
                    >
                        Hiện
                    </button>
                </div>

                <span
                        class="field-error"
                        data-field-error="confirmPassword"
                ></span>
            </div>

            <div
                    id="change-password-message"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                    hidden
            ></div>

            <div class="form-actions">
                <a
                        class="button secondary"
                        href="/pages/profile.html"
                >
                    Quay lại
                </a>

                <button
                        id="change-password-submit"
                        class="button primary"
                        type="submit"
                >
                    Đổi mật khẩu
                </button>
            </div>
        </form>
    </section>
</main>

<div data-app-footer></div>

<script src="/js/layout.js"></script>

<script
        type="module"
        src="/js/auth-ui.js"
></script>

<script
        type="module"
        src="/js/change-password.js"
></script>

</body>
</html>
