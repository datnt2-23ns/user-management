spring:
  application:
    name: UserManagement

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/user_management?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRST_NAME:Administrator}
    last-name: ${ADMIN_LAST_NAME:System}
    date-of-birth: ${ADMIN_DATE_OF_BIRTH:2000-01-01}
    gender: ${ADMIN_GENDER:OTHER}
    address: ${ADMIN_ADDRESS:System}
    phone: ${ADMIN_PHONE:0000000000}